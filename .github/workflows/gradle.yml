name: Gradle Build + CalVer Release

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: gradle

    - name: Generate CalVer
      id: calver
      run: |
        VERSION=$(date +'%Y.%m.%d')
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    # mod_version (gradle.properties) をその日の日付にして作る (fabric.mod.json の version にも入る)
    - name: Build
      run: ./gradlew --no-daemon build -Pmod_version=${{ steps.calver.outputs.version }}

    - name: Get Jar
      id: jar
      run: |
        JAR=$(ls build/libs/*.jar | grep -v -- '-sources.jar' | head -n 1)
        echo "jar=$JAR" >> $GITHUB_OUTPUT

    # PR用artifact
    - name: Upload PR Artifact
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: mod-pr-${{ github.event.pull_request.number }}
        path: ${{ steps.jar.outputs.jar }}

    # changelog生成 (pushのみ)
    - name: Generate Changelog
      if: github.event_name == 'push'
      run: |
        git log -10 --pretty=format:"- %s (%h)" > CHANGELOG.md

    # Release (pushのみ)
    - name: Create or Update Release
      if: github.event_name == 'push'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.calver.outputs.version }}
        name: ${{ steps.calver.outputs.version }}
        body_path: CHANGELOG.md
        files: ${{ steps.jar.outputs.jar }}
        replace_assets: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
